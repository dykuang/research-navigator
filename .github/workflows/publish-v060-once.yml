name: Publish v0.6.0 (one-time, pinned main)
on:
  push:
    branches:
      - release/v0.6.0-publish-once
    paths:
      - .github/workflows/publish-v060-once.yml
permissions:
  contents: write
  issues: write
jobs:
  publish:
    if: github.repository == 'dykuang/research-navigator'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify exact merged main, milestone and release identity
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_MAIN: 5a1b37e1015f7187da2b52037fc9cd50b285e6f9
        shell: bash
        run: |
          set -euo pipefail
          actual="$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')"
          if [ "$actual" != "$EXPECTED_MAIN" ]; then
            echo "::error::main advanced from inspected release SHA. Refusing to publish."; exit 1
          fi
          title="$(gh api "repos/$GH_REPO/milestones/5" --jq '.title')"
          case "$title" in "v0.6.0"*) ;; *) echo "::error::Unexpected milestone: $title"; exit 1;; esac
          for pr in 66 80; do
            merged="$(gh api "repos/$GH_REPO/pulls/$pr" --jq '.merged')"
            if [ "$merged" != "true" ]; then
              echo "::error::Dependency PR #$pr not merged"; exit 1
            fi
          done
          open="$(gh api "repos/$GH_REPO/issues?state=open&milestone=5&per_page=100" --jq '[.[] | select(.number != 67)] | length')"
          if [ "$open" != "0" ]; then
            echo "::error::$open uncompleted v0.6 milestone issues"; exit 1
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/v0.6.0" >/tmp/rn-v060-tag.json 2>/dev/null; then
            tag_target="$(gh api "repos/$GH_REPO/git/ref/tags/v0.6.0" --jq '.object.sha')"
            if [ "$tag_target" != "$EXPECTED_MAIN" ]; then
              echo "::error::Existing v0.6.0 tag does not point to approved main SHA"; exit 1
            fi
          fi
          echo "release gate passed at $EXPECTED_MAIN"
      - name: Publish official GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_MAIN: 5a1b37e1015f7187da2b52037fc9cd50b285e6f9
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## Highlights

          **Research Navigator v0.6.0** introduces the Unified Research Canvas & Node Editor: a single navigable graph for Grilling questions and answers, hypotheses and competing research branches, sources and scoped scientific evidence, ExperimentRuns/results, scientific Milestone criteria and provider-scoped SessionRefs.

          - **Unified infinite research canvas:** typed nodes, ports and directional curved wires, pan/zoom, minimap, filters, linked inspection and persistent layouts. The classic Canvas remains available.
          - **Protected scientific semantics:** cross-domain links are context references, not evidence validation. Creating/removing connections uses preview → pending proposal → explicit local-terminal approval; offline HTML only drafts changes. Existing archive/revival and Milestone approval safeguards remain.
          - **Continuous Grilling:** structured choices, **Other/custom answer** and optional supplementary text; ordinary-chat fallback when Codex interactive pickers are unavailable or fail. Responses and consensus are recoverable across sessions, with explicit exit approval.
          - **Multi-Harness context:** Codex and DeepSeek SessionRef/handoff capabilities from the integrated v0.5 work, without silently ingesting full conversation transcripts or automatically activating a Skill in a new session.
          - **Scientific traceability:** negative or contradictory results and evidence gaps remain visible without automatically promoting claims, experiments or Milestone acceptance.

          ## Getting started

          In an initialized research project, run:

          ```bash
          python scripts/build_dashboard.py PROJECT_ROOT
          ```

          Open `PROJECT_ROOT/research/canvas/unified.html` for the unified offline Node Editor or `PROJECT_ROOT/research/canvas/index.html` for the classic view.

          To submit protected semantic editing proposals locally:

          ```bash
          python scripts/local_editor.py serve PROJECT_ROOT
          ```

          Use the printed localhost URL and the `/unified` view; approval still requires an explicit local-terminal action. See [Unified Canvas guide](https://github.com/dykuang/research-navigator/blob/v0.6.0/references/unified-canvas-v06.md) and [v0.6 roadmap](https://github.com/dykuang/research-navigator/blob/v0.6.0/docs/roadmap/v0.6.md).

          ## Validation and limits

          [Final v0.6 PR-head CI](https://github.com/dykuang/research-navigator/actions/runs/46128560534) passed Linux Python 3.10/3.12, native Windows Python 3.12, and Chromium; legacy main-branch validations also passed after merge. Multi-round synthetic researcher journeys, context-approval flows and temporary-fixture cleanup are covered.

          **Not a certification of actual Codex/DeepSeek client UI behavior:** native picker visibility, agent installation and SessionRef deep linking still depend on the user's environment and warrant real-client checks. Conversation agreement is not independently verified scientific evidence.

          [Unified Canvas PR #80](https://github.com/dykuang/research-navigator/pull/80) · [Multi-Harness PR #66](https://github.com/dykuang/research-navigator/pull/66)
          NOTES
          if gh release view v0.6.0 --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "v0.6.0 Release already exists; no duplicate created"
          else
            gh release create v0.6.0 --repo "$GH_REPO" --target "$EXPECTED_MAIN" --title "Research Navigator v0.6.0 — Unified Research Canvas" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          fi
          gh release view v0.6.0 --repo "$GH_REPO" --json url,tagName,isDraft,isPrerelease --jq '.'
      - name: Close completed v0.6 issue and milestone
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v0.6.0 --repo "$GH_REPO" >/dev/null
          gh api --method PATCH "repos/$GH_REPO/issues/67" -f state=closed -f state_reason=completed --jq '"Issue #67: " + .state'
          gh api --method PATCH "repos/$GH_REPO/milestones/5" -f state=closed --jq '"Milestone #5: " + .state'
