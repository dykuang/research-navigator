name: Create v0.3 GitHub Milestone (one-time)
on:
  push:
    branches: [feat/v0.3-scientific-reasoning-graph]
    paths: [.github/workflows/v03-milestone.yml]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  milestone:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure milestone and assign v0.3 issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: python
        run: |
          import os, json, urllib.request, urllib.error
          repo = os.environ["REPO"]
          title = "v0.3 — Scientific Reasoning Graph"
          base = f"https://api.github.com/repos/{repo}"
          headers = {"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                     "Accept": "application/vnd.github+json",
                     "X-GitHub-Api-Version": "2022-11-28",
                     "User-Agent": "research-navigator-v03-milestone"}
          def api(method, url, obj=None):
              data = None if obj is None else json.dumps(obj).encode()
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as res:
                  return json.load(res)
          milestones = api("GET", base + "/milestones?state=all&per_page=100")
          existing = next((m for m in milestones if m["title"] == title), None)
          mile = existing or api("POST", base + "/milestones",
                                 {"title": title, "description":
                                  "v0.3: experiment run provenance, scoped claim evidence, SessionRef decision replay, reasoning graph and QA"})
          number = mile["number"]
          print("Milestone:", mile["html_url"], "(reused)" if existing else "(created)")
          for issue_number in range(20,28):
              issue = api("PATCH", base + f"/issues/{issue_number}", {"milestone": number})
              print(f"Linked #{issue_number} to milestone #{number}")
          assert all(api("GET", base + f"/issues/{n}")["milestone"]["number"] == number for n in range(20,28))
          print("Verified all eight v0.3 issues assigned.")
