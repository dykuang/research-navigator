name: Bootstrap v0.4 GitHub Milestone (temporary)
on:
  push:
    branches: [feat/v0.4-research-decision-intelligence]
    paths: [.github/workflows/v04-milestone-bootstrap.yml]
permissions:
  contents: read
  issues: write
jobs:
  native-milestone:
    runs-on: ubuntu-latest
    steps:
      - name: Create or reuse v0.4 native issue Milestone
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "v0.4 — Research Decision Intelligence"
        shell: bash
        run: |
          set -euo pipefail
          existing=$(gh api "repos/$GH_REPO/milestones?state=all&per_page=100" --jq '.[] | select(.title == env.TITLE) | .number' | head -n 1)
          if [ -n "$existing" ]; then
            echo "Existing native GitHub Milestone number: $existing"
          else
            gh api --method POST "repos/$GH_REPO/milestones" \
              -f title="$TITLE" \
              -f description="v0.4: evidence-aware research decision assistant, opportunity-cost recommendations, archive review, mentor decision briefs, protected proposals, and cross-platform validation; do not equate scientific milestones with GitHub milestones." \
              --jq '"Created native GitHub Milestone number: " + (.number|tostring)'
          fi
