name: Bootstrap v0.4.1 GitHub Milestone (temporary)
on:
  push:
    branches: [feat/v0.4.1-interview-lifecycle]
    paths: [.github/workflows/v041-milestone-bootstrap.yml]
permissions:
  contents: read
  issues: write
jobs:
  native-milestone:
    runs-on: ubuntu-latest
    steps:
      - name: Create or reuse native v0.4.1 milestone
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "v0.4.1 — Persistent Research Grilling Lifecycle"
        shell: bash
        run: |
          set -euo pipefail
          existing=$(gh api "repos/$GH_REPO/milestones?state=all&per_page=100" --jq '.[] | select(.title == env.TITLE) | .number' | head -n 1)
          if [ -n "$existing" ]; then
            echo "Existing milestone number: $existing"
          else
            gh api --method POST "repos/$GH_REPO/milestones" \
              -f title="$TITLE" \
              -f description="v0.4.1: persistent grilling interviews, question frontier, consensus handoff, explicit exit, new-session onboarding and safe recovery. Conversation activation is client-dependent." \
              --jq '"Created milestone number: " + (.number|tostring)'
          fi
