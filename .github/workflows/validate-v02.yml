name: Validate Research Navigator v0.2

on:
  push:
    branches:
      - v0.2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax compile
        run: python -m compileall -q scripts evals
      - name: Unit and regression tests
        run: python -m unittest discover -s evals -p 'test_*.py' -v
      - name: Synthetic demo
        run: |
          python evals/make_demo.py /tmp/research-navigator-demo
          python scripts/validate_state.py /tmp/research-navigator-demo
          python scripts/migrate_state.py preview /tmp/research-navigator-demo

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright + Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Real browser canvas smoke
        run: python evals/browser_check_canvas.py
      - name: Real browser semantic editing smoke
        run: python evals/browser_check_canvas_semantic.py
      - name: Real browser SessionRef smoke
        run: python evals/browser_check_canvas_sessions.py

  windows:
    name: Windows native Python and offline canvas smoke
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python and platform
        shell: pwsh
        run: |
          python --version
          python -c "import sys,platform; print(platform.platform()); assert sys.platform=='win32'"
      - name: Compile scripts and evaluation suite
        shell: pwsh
        run: python -m compileall -q scripts evals
      - name: Windows regression suite
        shell: pwsh
        run: python -m unittest discover -s evals -p "test_*.py" -v
      - name: Windows native synthetic project and HTML canvas
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP "rn-v02-synthetic-project"
          python evals/make_demo.py $project
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate_state.py $project
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/build_dashboard.py $project
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $canvas = Join-Path $project "research/canvas/index.html"
          $classic = Join-Path $project "research/dashboard/index.html"
          if (!(Test-Path $canvas) -or !(Test-Path $classic)) { throw "Generated HTML not found" }
          Write-Host "PASS Windows project + Canvas + classic dashboard: $canvas"
