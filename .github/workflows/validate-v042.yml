name: Validate Research Navigator v0.4.2
on:
  push:
    branches: [feat/v0.4.2-interactive-grilling]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile all Python sources
        run: python -m compileall -q scripts evals
      - name: v0.1-v0.4.2 full unit regression
        run: python -m unittest discover -s evals -p "test_*.py" -v
      - name: Interactive multi-round research UAT, fixture cleanup
        run: python evals/uat_v042_multiround.py
      - name: Previous interview persistence UAT
        run: python evals/uat_v041_multiround.py
      - name: Previous research decision UAT
        run: python evals/uat_v04_researcher_rounds.py
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: "Interactive choice cards: Other and mobile"
        run: python evals/browser_check_v042.py
      - name: Previous interview and decision Canvas regressions
        run: |
          python evals/browser_check_v041.py
          python evals/browser_check_v04.py
