name: Validate Research Navigator v0.6 Unified Canvas
on:
  push:
    branches: [feat/v0.6-unified-research-canvas]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile source and tests
        run: python -m compileall -q scripts evals
      - name: All canonical, v0.2-v0.5 and unified tests
        run: python -m unittest discover -s evals -p "test_*.py" -v
      - name: Seven-round interview cross-session UAT
        run: python evals/uat_v042_multiround.py
      - name: Existing six-round research decision journeys
        run: python evals/uat_v04_researcher_rounds.py
      - name: Unified v0.6 research journeys and cleanup
        run: python evals/uat_v06_researcher.py
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Unified Canvas interactive smoke
        run: python evals/browser_check_unified.py
      - name: Legacy Canvas, interviews and v0.5 SessionRef browser regressions
        run: |
          python evals/browser_check_canvas.py
          python evals/browser_check_canvas_semantic.py
          python evals/browser_check_canvas_sessions.py
          python evals/browser_check_v042.py
